<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neuro-Atlas | Clinical Lab</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; pointer-events: none; }
        h1 { font-size: 1.8rem; margin: 0; letter-spacing: 1px; color: #ffffff; }
        p { color: #888; font-size: 0.9rem; margin-top: 5px; }
        
        /* The Floating Glass Cards */
        .annotation-card {
            background: rgba(10, 10, 12, 0.85);
            border: 1px solid #4facfe;
            border-radius: 8px;
            padding: 12px 16px;
            width: 240px;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s ease, transform 0.3s ease;
        }
        
        .annotation-card:hover {
            border-color: #ffffff;
            transform: scale(1.02);
            z-index: 100;
        }

        .anno-title {
            color: #4facfe;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(79, 172, 254, 0.3);
            padding-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .anno-desc {
            color: #dcdcdc;
            font-size: 0.85rem;
            line-height: 1.4;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <h1>Neuro-Atlas v2.0</h1>
        <p id="status">Synchronizing Anatomical Data...</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        const statusText = document.getElementById('status');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 30); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none'; 
        document.body.appendChild(labelRenderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(10, 10, 10);
        scene.add(dirLight);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.minDistance = 10;
        controls.maxDistance = 60;

        function createAnnotation(title, description, targetPosition, labelOffset) {
            const div = document.createElement('div');
            div.className = 'annotation-card';
            div.innerHTML = `<div class="anno-title">${title}</div><div class="anno-desc">${description}</div>`;
            
            const label = new CSS2DObject(div);
            label.position.copy(labelOffset);
            scene.add(label);

            const points = [targetPosition, labelOffset];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(geometry, new THREE.LineBasicMaterial({ color: 0x4facfe, opacity: 0.4, transparent: true }));
            scene.add(line);
        }

        const loader = new GLTFLoader();
        
        // FIXED PATH FOR GITHUB PAGES
        loader.load('brain_model.glb', (gltf) => {
            const brainModel = gltf.scene;
            
            const box = new THREE.Box3().setFromObject(brainModel);
            const maxDim = Math.max(box.max.x - box.min.x, box.max.y - box.min.y, box.max.z - box.min.z);
            const scale = 12 / maxDim; 
            brainModel.scale.set(scale, scale, scale);
            
            const center = new THREE.Box3().setFromObject(brainModel).getCenter(new THREE.Vector3());
            brainModel.position.sub(center);

            scene.add(brainModel);
            statusText.innerText = "System Online. Explore regions.";

            // CLINICAL ANNOTATIONS
            createAnnotation("Frontal Lobe", "Executive function, emotional regulation, and decision-making.", new THREE.Vector3(0, 2, 5), new THREE.Vector3(0, 9, 10));
            createAnnotation("Temporal Lobe", "Auditory processing, memory, and emotional context (Limbic link).", new THREE.Vector3(-5, -1, 0), new THREE.Vector3(-12, -2, 2));
            createAnnotation("Parietal Lobe", "Integration of sensory input and spatial awareness.", new THREE.Vector3(0, 5, -2), new THREE.Vector3(0, 10, -5));
            createAnnotation("Cerebellum", "Motor control and cognitive regulation of fear/pleasure.", new THREE.Vector3(0, -4, -4), new THREE.Vector3(0, -10, -8));

        }, undefined, (err) => {
            console.error(err);
            statusText.innerText = "ERROR: Could not fetch brain_model.glb. Ensure file is in root.";
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
