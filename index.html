<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neuro-Atlas | Educational View</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; pointer-events: none; }
        h1 { font-size: 1.8rem; margin: 0; letter-spacing: 1px; color: #ffffff; }
        p { color: #888; font-size: 0.9rem; margin-top: 5px; }
        
        /* The Floating Glass Cards */
        .annotation-card {
            background: rgba(10, 10, 12, 0.85);
            border: 1px solid #4facfe;
            border-radius: 8px;
            padding: 12px 16px;
            width: 220px;
            pointer-events: auto; /* Allows user to hover without clicking through */
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s ease, transform 0.3s ease;
        }
        
        .annotation-card:hover {
            border-color: #ffffff;
            transform: scale(1.02);
            z-index: 100;
        }

        .anno-title {
            color: #4facfe;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(79, 172, 254, 0.3);
            padding-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .anno-desc {
            color: #dcdcdc;
            font-size: 0.85rem;
            line-height: 1.4;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <h1>Neuro-Atlas v2.0</h1>
        <p id="status">Loading Anatomical Map...</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        const statusText = document.getElementById('status');

        // --- 1. Scene & Camera ---
        const scene = new THREE.Scene();
        // Pulled the camera back so the labels have room to float
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 30); 

        // --- 2. WebGL Renderer (The Brain) ---
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- 3. CSS2D Renderer (The HTML Labels) ---
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        // pointerEvents = 'none' here allows you to click and drag the brain THROUGH the empty space between labels
        labelRenderer.domElement.style.pointerEvents = 'none'; 
        document.body.appendChild(labelRenderer.domElement);

        // --- 4. Clinical Lighting ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(10, 10, 10);
        scene.add(dirLight);
        scene.add(new THREE.DirectionalLight(0xffffff, 0.5).position.set(-10, -10, -10));

        // --- 5. Controls ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.minDistance = 10;
        controls.maxDistance = 50;

        // --- 6. THE ANNOTATION ENGINE ---
        function createAnnotation(title, description, targetPosition, labelOffset) {
            // A. Create the UI Card
            const div = document.createElement('div');
            div.className = 'annotation-card';
            div.innerHTML = `
                <div class="anno-title">${title}</div>
                <div class="anno-desc">${description}</div>
            `;
            
            // B. Attach it to the 3D world
            const label = new CSS2DObject(div);
            label.position.copy(labelOffset);
            scene.add(label);

            // C. Draw the connecting line
            const points = [targetPosition, labelOffset];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: 0x4facfe, opacity: 0.5, transparent: true });
            const line = new THREE.Line(geometry, material);
            scene.add(line);
        }

        // --- 7. Load the Brain ---
        const loader = new GLTFLoader();
        
        loader.load('./brain_model.glb', (gltf) => {
            const brainModel = gltf.scene;
            
            // Standardize the size and center it perfectly
            const box = new THREE.Box3().setFromObject(brainModel);
            const maxDim = Math.max(box.max.x - box.min.x, box.max.y - box.min.y, box.max.z - box.min.z);
            const scale = 12 / maxDim; 
            brainModel.scale.set(scale, scale, scale);
            
            const center = new THREE.Box3().setFromObject(brainModel).getCenter(new THREE.Vector3());
            brainModel.position.sub(center);

            scene.add(brainModel);
            statusText.innerText = "Atlas Loaded. Rotate to explore.";

            // --- 8. PLACING THE LABELS ---
            // Format: Title, Description, Brain Attachment Point (X,Y,Z), Floating Card Position (X,Y,Z)
            // *NOTE: If a line is pointing to empty space or inside the brain, adjust the first Vector3.*
            
            createAnnotation(
                "Frontal Lobe", 
                "Governs executive function, emotional regulation, and complex decision-making.", 
                new THREE.Vector3(0, 3, 5),    // Attaches to the front of the brain
                new THREE.Vector3(0, 8, 8)     // Floats above and in front
            );

            createAnnotation(
                "Temporal Lobe", 
                "Primary center for auditory processing, memory consolidation, and emotional context.", 
                new THREE.Vector3(-4, -1, 1),  // Attaches to the left side
                new THREE.Vector3(-8, -2, 2)   // Floats to the left
            );

            createAnnotation(
                "Parietal Lobe", 
                "Processes somatosensory information (touch, temperature) and spatial awareness.", 
                new THREE.Vector3(0, 5, -2),   // Attaches to the top back
                new THREE.Vector3(0, 9, -4)    // Floats above and behind
            );

            createAnnotation(
                "Cerebellum", 
                "Crucial for motor control, balance, and cognitive regulation of fear and pleasure.", 
                new THREE.Vector3(0, -4, -4),  // Attaches to the bottom back
                new THREE.Vector3(0, -8, -6)   // Floats below and behind
            );

        }, undefined, (err) => {
            console.error(err);
            statusText.innerText = "ERROR: Cannot find brain_model.glb.";
        });

        // --- 9. Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera); // Renders the HTML cards
        }
        animate();

        // --- 10. Resize Handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
